<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flower Garden — Sign In</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;500&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: #f7f2e8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    canvas#bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      background: rgba(255, 252, 245, 0.92);
      border: 1.5px solid #d4c8a8;
      border-radius: 24px;
      padding: 52px 56px;
      width: 380px;
      text-align: center;
      box-shadow: 0 8px 40px rgba(80, 60, 20, 0.10);
      backdrop-filter: blur(4px);
    }

    .logo {
      font-size: 40px;
      margin-bottom: 8px;
      line-height: 1;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      color: #2d5a1b;
      margin-bottom: 6px;
      letter-spacing: 0.01em;
    }

    .subtitle {
      font-size: 14px;
      color: #8a7a5a;
      margin-bottom: 36px;
      line-height: 1.5;
    }

    .google-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 14px 20px;
      background: #fff;
      border: 1.5px solid #d4c8a8;
      border-radius: 50px;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 500;
      color: #3c3320;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .google-btn:hover {
      background: #f0ece0;
      border-color: #b8aa88;
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(80, 60, 20, 0.12);
    }

    .google-btn svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 24px 0;
      color: #c0b090;
      font-size: 13px;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #ddd4b8;
    }

    .guest-btn {
      width: 100%;
      padding: 12px 20px;
      background: transparent;
      border: 1.5px solid #c8b88a;
      border-radius: 50px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      color: #7a6a4a;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
      display: block;
    }

    .guest-btn:hover {
      background: #f0ece0;
      color: #3c3320;
    }

    .footer-note {
      margin-top: 28px;
      font-size: 12px;
      color: #b0a080;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <canvas id="bg"></canvas>

  <div class="card">
    <div class="logo">🌸</div>
    <h1>Flower Garden</h1>
    <p class="subtitle">Grow your collection of beautiful flowers.<br>Draw, discover, and bloom.</p>

    <!-- Replace YOUR_GOOGLE_CLIENT_ID with your actual Google OAuth client ID -->
    <button class="google-btn" onclick="signInWithGoogle()">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Continue with Google
    </button>

    <div class="divider">or</div>

    <a href="gallery.html" class="guest-btn">Browse as Guest</a>

    <p class="footer-note">By continuing, you agree to our Terms of Service.<br>Your flowers are yours forever.</p>
  </div>

  <script>
    // ── Background flower canvas ──────────────────────────────────────────────
    const canvas = document.getElementById('bg');
    const ctx = canvas.getContext('2d');
    let flowers = [];

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', () => { resize(); initFlowers(); draw(); });
    resize();

    const FLOWER_TYPES = ['daisy', 'tulip', 'simple', 'star', 'blob'];
    const COLORS = ['#e8a0b0','#f0c060','#e07060','#f5a060','#d090c0','#a0c878','#f0d080','#e86868','#ffa0a0','#ffcc88'];

    function randomFlower() {
      return {
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: 12 + Math.random() * 22,
        type: FLOWER_TYPES[Math.floor(Math.random() * FLOWER_TYPES.length)],
        color: COLORS[Math.floor(Math.random() * COLORS.length)],
        color2: COLORS[Math.floor(Math.random() * COLORS.length)],
        rotation: Math.random() * Math.PI * 2,
        opacity: 0.15 + Math.random() * 0.25,
        speed: 0.0002 + Math.random() * 0.0004,
        phase: Math.random() * Math.PI * 2,
      };
    }

    function initFlowers() {
      const count = Math.floor((canvas.width * canvas.height) / 14000);
      flowers = Array.from({ length: count }, randomFlower);
    }
    initFlowers();

    function drawDaisy(ctx, x, y, r, color, color2, rot) {
      const petals = 8;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rot);
      for (let i = 0; i < petals; i++) {
        ctx.save();
        ctx.rotate((i / petals) * Math.PI * 2);
        ctx.beginPath();
        ctx.ellipse(0, -r * 0.7, r * 0.28, r * 0.5, 0, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
        ctx.restore();
      }
      ctx.beginPath();
      ctx.arc(0, 0, r * 0.32, 0, Math.PI * 2);
      ctx.fillStyle = color2;
      ctx.fill();
      ctx.restore();
    }

    function drawTulip(ctx, x, y, r, color, rot) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rot);
      // stem
      ctx.beginPath();
      ctx.moveTo(0, r * 0.4);
      ctx.lineTo(0, r * 1.3);
      ctx.strokeStyle = '#5a8a3a';
      ctx.lineWidth = r * 0.12;
      ctx.lineCap = 'round';
      ctx.stroke();
      // petals
      ctx.beginPath();
      ctx.moveTo(0, -r * 0.5);
      ctx.bezierCurveTo(r * 0.6, -r * 0.5, r * 0.7, r * 0.3, 0, r * 0.4);
      ctx.bezierCurveTo(-r * 0.7, r * 0.3, -r * 0.6, -r * 0.5, 0, -r * 0.5);
      ctx.fillStyle = color;
      ctx.fill();
      ctx.restore();
    }

    function drawSimple(ctx, x, y, r, color, color2, rot) {
      const petals = 5;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rot);
      for (let i = 0; i < petals; i++) {
        ctx.save();
        ctx.rotate((i / petals) * Math.PI * 2);
        ctx.beginPath();
        ctx.ellipse(0, -r * 0.6, r * 0.32, r * 0.48, 0, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
        ctx.restore();
      }
      ctx.beginPath();
      ctx.arc(0, 0, r * 0.28, 0, Math.PI * 2);
      ctx.fillStyle = color2;
      ctx.fill();
      ctx.restore();
    }

    function drawStar(ctx, x, y, r, color, rot) {
      const spikes = 6;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rot);
      ctx.beginPath();
      for (let i = 0; i < spikes * 2; i++) {
        const angle = (i / (spikes * 2)) * Math.PI * 2 - Math.PI / 2;
        const radius = i % 2 === 0 ? r : r * 0.42;
        ctx.lineTo(Math.cos(angle) * radius, Math.sin(angle) * radius);
      }
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();
      ctx.restore();
    }

    function drawBlob(ctx, x, y, r, color, rot) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rot);
      const petals = 4 + Math.floor(Math.random() * 3);
      ctx.beginPath();
      for (let i = 0; i <= petals * 4; i++) {
        const t = (i / (petals * 4)) * Math.PI * 2;
        const radius = r * (0.7 + 0.3 * Math.cos(petals * t));
        ctx.lineTo(Math.cos(t) * radius, Math.sin(t) * radius);
      }
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();
      ctx.restore();
    }

    let t = 0;
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      t += 1;
      flowers.forEach(f => {
        ctx.globalAlpha = f.opacity;
        const wobble = f.rotation + Math.sin(t * f.speed + f.phase) * 0.15;
        const yOff = Math.sin(t * f.speed * 0.7 + f.phase) * 4;
        switch (f.type) {
          case 'daisy':  drawDaisy(ctx, f.x, f.y + yOff, f.r, f.color, f.color2, wobble); break;
          case 'tulip':  drawTulip(ctx, f.x, f.y + yOff, f.r, f.color, wobble); break;
          case 'simple': drawSimple(ctx, f.x, f.y + yOff, f.r, f.color, f.color2, wobble); break;
          case 'star':   drawStar(ctx, f.x, f.y + yOff, f.r, f.color, wobble); break;
          case 'blob':   drawBlob(ctx, f.x, f.y + yOff, f.r, f.color, wobble); break;
        }
      });
      ctx.globalAlpha = 1;
      requestAnimationFrame(draw);
    }
    draw();

    // ── Google Sign-In ────────────────────────────────────────────────────────
    function signInWithGoogle() {
      // TODO: Replace with your Google OAuth Client ID
      // Instructions:
      // 1. Go to https://console.cloud.google.com/
      // 2. Create a project → APIs & Services → Credentials → OAuth 2.0 Client ID
      // 3. Add your domain to Authorized JavaScript origins
      // 4. Replace the client_id below
      const CLIENT_ID = 'YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com';

      if (CLIENT_ID === 'YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com') {
        // Demo mode: skip auth and go to gallery
        alert('Demo mode: No Google Client ID configured.\nRedirecting to gallery...');
        window.location.href = 'gallery.html';
        return;
      }

      // Load Google Identity Services
      const script = document.createElement('script');
      script.src = 'https://accounts.google.com/gsi/client';
      script.onload = () => {
        google.accounts.oauth2.initTokenClient({
          client_id: CLIENT_ID,
          scope: 'openid email profile',
          callback: (response) => {
            if (response.access_token) {
              sessionStorage.setItem('gToken', response.access_token);
              window.location.href = 'gallery.html';
            }
          },
        }).requestAccessToken();
      };
      document.head.appendChild(script);
    }
  </script>
</body>
</html>
